{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-10">
    <div class="glass-card p-8">
        <h1 class="text-2xl font-extrabold mb-6" style="color:var(--neon-blue);">Edit Profile</h1>
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block text-sm font-semibold mb-1" style="color:var(--muted);">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-400 text-xs mt-1">{{ field.errors|join:", " }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-cta w-full py-3 rounded-xl font-bold mt-2">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
